document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 05 MMM SIMULATOR ============ -->\n<section id=\"simulator\" data-screen-label=\"Budget simulator\" style=\"padding: 90px 40px; max-width: 1200px; margin: 0 auto; border-top: 1px solid var(--line);\">\n  <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--accent); margin-bottom: 12px;\">05 — MARKETING MIX<\u002Fdiv>\n  <div style=\"display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 20px; margin-bottom: 44px;\">\n    <h2 style=\"margin: 0; font-size: clamp(30px, 3.6vw, 46px); letter-spacing: -0.03em; font-weight: 700; animation: revealL 1ms linear both; animation-timeline: view(); animation-range: entry 0% entry 40%;\">Move the budget, watch the math<\u002Fh2>\n    <p style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted); margin: 0; max-width: 380px; line-height: 1.6; animation: revealR 1ms linear both; animation-timeline: view(); animation-range: entry 0% entry 40%;\">DIMINISHING-RETURNS RESPONSE CURVES, THE WAY MY MMM MODELS TREAT THEM. DRAG THE SLIDERS.<\u002Fp>\n  <\u002Fdiv>\n\n  <div id=\"simGrid\" style=\"display: grid; grid-template-columns: 1.3fr 1fr; gap: 24px; align-items: stretch;\">\n    <div style=\"background: var(--card); border: 1px solid var(--line); padding: 30px; display: flex; flex-direction: column; gap: 24px; animation: revealL 1ms linear both; animation-timeline: view(); animation-range: entry 0% entry 30%;\">\n      <sc-for list=\"{{ simRows }}\" as=\"r\" hint-placeholder-count=\"4\">\n        <div>\n          <div style=\"display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 12px; margin-bottom: 8px;\">\n            <span style=\"font-weight: 600;\">{{ r.label }}<\u002Fspan>\n            <span style=\"color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums;\">{{ r.valueText }} / MO<\u002Fspan>\n          <\u002Fdiv>\n          <input type=\"range\" min=\"0\" max=\"300\" step=\"5\" value=\"{{ r.value }}\" onchange=\"{{ r.onChange }}\" style=\"width: 100%; accent-color: var(--accent); cursor: grab; margin: 0;\">\n          <div style=\"display: flex; justify-content: space-between; align-items: center; gap: 14px; margin-top: 8px;\">\n            <div style=\"flex: 1; height: 6px; background: var(--track);\">\n              <div style=\"height: 100%; width: {{ r.barW }}%; background: rgba(31,95,69,0.55); transition: width 0.3s;\"><\u002Fdiv>\n            <\u002Fdiv>\n            <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--muted); white-space: nowrap;\">≈ {{ r.leadsText }} · {{ r.mText }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--muted);\">CURVES FIT ON HISTORICAL CAMPAIGN DATA · ILLUSTRATIVE PARAMETERS<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background: #14120E; color: #F2EFE6; padding: 30px; display: flex; flex-direction: column; gap: 22px; animation: revealR 1ms linear both; animation-timeline: view(); animation-range: entry 0% entry 30%;\">\n      <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 18px;\">\n        <div>\n          <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: #8B857A;\">TOTAL SPEND<\u002Fdiv>\n          <div style=\"font-size: 32px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums;\">{{ simTotalSpend }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: #8B857A;\">PROJECTED LEADS / MO<\u002Fdiv>\n          <div style=\"font-size: 32px; font-weight: 700; letter-spacing: -0.02em; color: #7FD6AE; font-variant-numeric: tabular-nums;\">{{ simTotalLeads }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: #8B857A;\">BLENDED COST PER LEAD<\u002Fdiv>\n        <div style=\"font-size: 32px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums;\">{{ simCpl }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top: auto; padding-top: 18px; border-top: 1px solid rgba(255,255,255,0.12);\">\n        <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: #8B857A; margin-bottom: 10px;\">MODEL RECOMMENDATION<\u002Fdiv>\n        <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; line-height: 1.7; color: #7FD6AE;\">→ {{ simAdvice }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 06 SQL TERMINAL ============ -->\n<section id=\"sql\" data-screen-label=\"SQL terminal\" style=\"padding: 90px 40px; max-width: 1200px; margin: 0 auto; border-top: 1px solid var(--line);\">\n  <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--accent); margin-bottom: 12px;\">06 — RAW ACCESS<\u002Fdiv>\n  <div style=\"display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 20px; margin-bottom: 44px;\">\n    <h2 style=\"margin: 0; font-size: clamp(30px, 3.6vw, 46px); letter-spacing: -0.03em; font-weight: 700; animation: revealL 1ms linear both; animation-timeline: view(); animation-range: entry 0% entry 40%;\">The queries behind the charts<\u002Fh2>\n    <p style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted); margin: 0; max-width: 380px; line-height: 1.6;\">DASHBOARDS ARE THE LAST MILE. THIS IS WHERE THE ANSWERS ACTUALLY COME FROM.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"background: #14120E; border: 1px solid #14120E; animation: revealPop 1ms linear both; animation-timeline: view(); animation-range: entry 0% entry 25%;\">\n    <div style=\"display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; padding: 16px 24px; border-bottom: 1px solid rgba(255,255,255,0.12);\">\n      <div style=\"display: flex; gap: 6px; flex-wrap: wrap;\">\n        <sc-for list=\"{{ sqlTabs }}\" as=\"st\" hint-placeholder-count=\"3\">\n          <button onclick=\"{{ st.onClick }}\" style=\"padding: 9px 16px; border: 1px solid {{ st.border }}; background: {{ st.bg }}; color: {{ st.fg }}; font-family: 'IBM Plex Mono', monospace; font-size: 11px; cursor: pointer; border-radius: 2px; transition: all 0.2s;\">{{ st.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <button onclick=\"{{ runSql }}\" style=\"padding: 10px 24px; background: #7FD6AE; color: #14120E; border: none; font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; cursor: pointer; letter-spacing: 0.05em;\" style-hover=\"background: #A5E5C6;\">{{ sqlRunLabel }}<\u002Fbutton>\n    <\u002Fdiv>\n\n    <div style=\"padding: 24px; overflow-x: auto;\">\n      <sc-for list=\"{{ sqlLines }}\" as=\"l\" hint-placeholder-count=\"10\">\n        <div style=\"display: flex; gap: 20px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; line-height: 1.75;\">\n          <span style=\"color: rgba(255,255,255,0.25); width: 20px; text-align: right; flex-shrink: 0; user-select: none;\">{{ l.n }}<\u002Fspan>\n          <span style=\"color: {{ l.color }}; white-space: pre;\">{{ l.t }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ sqlRunning }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding: 20px 24px; border-top: 1px solid rgba(255,255,255,0.12); font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #7FD6AE;\">QUERYING BIGQUERY… <span style=\"animation: floatY 0.8s ease-in-out infinite; display: inline-block;\">▊<\u002Fspan><\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ sqlDone }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"border-top: 1px solid rgba(255,255,255,0.12); padding: 20px 24px; animation: fadeUp 0.4s cubic-bezier(0.25,1,0.5,1);\">\n        <div style=\"display: grid; grid-template-columns: {{ sqlGrid }}; gap: 10px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.2); font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #8B857A;\">\n          <sc-for list=\"{{ sqlCols }}\" as=\"col\" hint-placeholder-count=\"4\"><span>{{ col }}<\u002Fspan><\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-for list=\"{{ sqlRows }}\" as=\"row\" hint-placeholder-count=\"6\">\n          <div style=\"display: grid; grid-template-columns: {{ sqlGrid }}; gap: 10px; padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,0.07); font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; color: #E8E4D8;\">\n            <sc-for list=\"{{ row.cells }}\" as=\"cell\" hint-placeholder-count=\"4\"><span style=\"font-variant-numeric: tabular-nums;\">{{ cell }}<\u002Fspan><\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: #8B857A; margin-top: 14px;\">{{ sqlMeta }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 07 PRIVACY ============ -->\n<section id=\"privacy\" data-screen-label=\"Privacy\" style=\"padding: 90px 40px; max-width: 1200px; margin: 0 auto; border-top: 1px solid var(--line);\">\n  <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--accent); margin-bottom: 12px;\">07 — PRIVACY ENGINEERING<\u002Fdiv>\n  <div id=\"privGrid\" style=\"display: grid; grid-template-columns: 1fr 1.25fr; gap: 60px; align-items: start;\">\n    <div style=\"animation: revealL 1ms linear both; animation-timeline: view(); animation-range: entry 0% entry 30%;\">\n      <h2 style=\"margin: 0 0 24px; font-size: clamp(30px, 3.6vw, 46px); letter-spacing: -0.03em; font-weight: 700;\">Measurement that survives a “no”<\u002Fh2>\n      <p style=\"font-size: 16px; line-height: 1.7; color: var(--body); margin: 0 0 34px; max-width: 460px;\">At a bank, tracking has to hold up under PIPEDA and GDPR — and under ad blockers and Safari's ITP. Flip the switches: this is the consent architecture I built at Simplii with Consent Mode v2 and server-side GTM.<\u002Fp>\n      <div style=\"display: flex; flex-direction: column; gap: 18px;\">\n        <div>\n          <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); margin-bottom: 8px;\">USER CONSENT<\u002Fdiv>\n          <div style=\"display: inline-flex; border: 1px solid var(--ink); border-radius: 2px; overflow: hidden;\">\n            <button onclick=\"{{ setConsentYes }}\" style=\"padding: 11px 20px; border: none; font-family: 'IBM Plex Mono', monospace; font-size: 12px; cursor: pointer; background: {{ cgYesBg }}; color: {{ cgYesFg }};\">GRANTED<\u002Fbutton>\n            <button onclick=\"{{ setConsentNo }}\" style=\"padding: 11px 20px; border: none; border-left: 1px solid var(--ink); font-family: 'IBM Plex Mono', monospace; font-size: 12px; cursor: pointer; background: {{ cgNoBg }}; color: {{ cgNoFg }};\">DENIED<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); margin-bottom: 8px;\">TAGGING ARCHITECTURE<\u002Fdiv>\n          <div style=\"display: inline-flex; border: 1px solid var(--ink); border-radius: 2px; overflow: hidden;\">\n            <button onclick=\"{{ setClientSide }}\" style=\"padding: 11px 20px; border: none; font-family: 'IBM Plex Mono', monospace; font-size: 12px; cursor: pointer; background: {{ ssNoBg }}; color: {{ ssNoFg }};\">CLIENT-SIDE<\u002Fbutton>\n            <button onclick=\"{{ setServerSide }}\" style=\"padding: 11px 20px; border: none; border-left: 1px solid var(--ink); font-family: 'IBM Plex Mono', monospace; font-size: 12px; cursor: pointer; background: {{ ssYesBg }}; color: {{ ssYesFg }};\">SERVER-SIDE (SGTM)<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background: var(--card); border: 1px solid var(--line); animation: revealR 1ms linear both; animation-timeline: view(); animation-range: entry 0% entry 30%;\">\n      <sc-for list=\"{{ consentSignals }}\" as=\"sig\" hint-placeholder-count=\"6\">\n        <div style=\"display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 17px 26px; border-bottom: 1px solid var(--line2);\">\n          <div>\n            <div style=\"font-size: 14.5px; font-weight: 600;\">{{ sig.name }}<\u002Fdiv>\n            <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--muted); margin-top: 4px;\">{{ sig.note }}<\u002Fdiv>\n          <\u002Fdiv>\n          <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; color: {{ sig.color }}; white-space: nowrap; transition: color 0.3s;\">{{ sig.status }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 04 CAREER ============ -->\n<section id=\"career\" data-screen-label=\"Career\" style=\"padding: 90px 40px; max-width: 1200px; margin: 0 auto; border-top: 1px solid var(--line);\">\n  <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--accent); margin-bottom: 12px;\">08 — CAREER<\u002Fdiv>\n  <h2 style=\"margin: 0 0 50px; font-size: clamp(30px, 3.6vw, 46px); letter-spacing: -0.03em; font-weight: 700; animation: revealL 1ms linear both; animation-timeline: view(); animation-range: entry 0% entry 40%;\">Five years, two ecosystems<\u002Fh2>\n\n  <div style=\"display: flex; flex-direction: column; gap: 28px;\">\n    <sc-for list=\"{{ jobs }}\" as=\"job\" hint-placeholder-count=\"2\">\n      <article style=\"background: var(--card); border: 1px solid var(--line); animation: {{ job.anim }} 1ms linear both; animation-timeline: view(); animation-range: entry 0% entry 20%;\">\n        <div style=\"padding: 30px 30px 24px; display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 16px; border-bottom: 1px solid var(--line2);\">\n          <div>\n            <h3 style=\"margin: 0; font-size: 26px; letter-spacing: -0.02em; font-weight: 700;\">{{ job.company }}<\u002Fh3>\n            <div style=\"font-size: 15px; color: var(--body); margin-top: 6px;\">{{ job.role }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"text-align: right;\">\n            <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--accent); font-weight: 600;\">{{ job.period }}<\u002Fdiv>\n            <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); margin-top: 4px;\">{{ job.location }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 8px; padding: 18px 30px; border-bottom: 1px solid var(--line2);\">\n          <sc-for list=\"{{ job.metrics }}\" as=\"m\" hint-placeholder-count=\"4\">\n            <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; padding: 6px 12px; background: var(--track); color: var(--body);\">{{ m }}<\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div>\n          <sc-for list=\"{{ job.groups }}\" as=\"g\" hint-placeholder-count=\"4\">\n            <div style=\"border-bottom: 1px solid var(--line2);\">\n              <button onclick=\"{{ g.toggle }}\" style=\"width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 18px 30px; background: none; border: none; cursor: pointer; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; text-align: left;\" style-hover=\"background: var(--paper);\">\n                <span style=\"font-size: 15px; font-weight: 600; color: var(--ink);\">{{ g.title }}<\u002Fspan>\n                <span style=\"display: flex; align-items: center; gap: 14px;\">\n                  <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted);\">{{ g.count }}<\u002Fspan>\n                  <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 16px; color: var(--accent);\">{{ g.arrow }}<\u002Fspan>\n                <\u002Fspan>\n              <\u002Fbutton>\n              <sc-if value=\"{{ g.open }}\" hint-placeholder-val=\"{{ false }}\">\n                <ul style=\"margin: 0; padding: 4px 30px 24px 30px; list-style: none; display: flex; flex-direction: column; gap: 12px; animation: fadeUp 0.35s cubic-bezier(0.25,1,0.5,1);\">\n                  <sc-for list=\"{{ g.items }}\" as=\"a\" hint-placeholder-count=\"4\">\n                    <li style=\"display: flex; gap: 12px; font-size: 14.5px; line-height: 1.65; color: var(--body);\">\n                      <span style=\"color: var(--accent); font-family: 'IBM Plex Mono', monospace;\">→<\u002Fspan>\n                      <span>{{ a }}<\u002Fspan>\n                    <\u002Fli>\n                  <\u002Fsc-for>\n                <\u002Ful>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Farticle>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <!-- Education + certs -->\n  <div id=\"eduGrid\" style=\"display: grid; grid-template-columns: 1fr 2fr; gap: 24px; margin-top: 28px;\">\n    <div style=\"background: var(--card); border: 1px solid var(--line); padding: 26px; animation: revealL 1ms linear both; animation-timeline: view(); animation-range: entry 0% entry 35%;\">\n      <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); margin-bottom: 14px;\">EDUCATION<\u002Fdiv>\n      <div style=\"font-size: 16px; font-weight: 600;\">Bachelor's degree<\u002Fdiv>\n      <div style=\"font-size: 13px; color: var(--muted); margin-top: 4px;\">Karunya University<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background: var(--card); border: 1px solid var(--line); padding: 26px; animation: revealR 1ms linear both; animation-timeline: view(); animation-range: entry 0% entry 35%;\">\n      <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); margin-bottom: 14px;\">CERTIFICATIONS<\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px;\">\n        <div style=\"font-size: 14px;\"><span style=\"font-weight: 600;\">Google Analytics Advanced<\u002Fspan><br><span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted);\">JUN 2023<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size: 14px;\"><span style=\"font-weight: 600;\">Microsoft Data Analyst Associate<\u002Fspan><br><span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted);\">MAY 2022<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size: 14px;\"><span style=\"font-weight: 600;\">Tableau Desktop Specialist<\u002Fspan><br><span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted);\">FEB 2022<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size: 14px;\"><span style=\"font-weight: 600;\">Advanced SQL for Data Science<\u002Fspan><br><span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted);\">JAN 2022<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 05 SKILLS ============ -->\n<section id=\"skills\" data-screen-label=\"Skills\" style=\"padding: 90px 40px; max-width: 1200px; margin: 0 auto; border-top: 1px solid var(--line);\">\n  <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--accent); margin-bottom: 12px;\">09 — STACK<\u002Fdiv>\n  <div style=\"display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 20px; margin-bottom: 36px;\">\n    <h2 style=\"margin: 0; font-size: clamp(30px, 3.6vw, 46px); letter-spacing: -0.03em; font-weight: 700; animation: revealL 1ms linear both; animation-timeline: view(); animation-range: entry 0% entry 40%;\">The full stack, filterable<\u002Fh2>\n    <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted);\">{{ skillCountText }}<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 34px; transform-origin: 50% 0; animation: gridIn 1ms linear both; animation-timeline: view(); animation-range: entry 0% entry 40%;\">\n    <sc-for list=\"{{ skillChips }}\" as=\"c\" hint-placeholder-count=\"10\">\n      <button onclick=\"{{ c.onClick }}\" style=\"padding: 9px 16px; border: 1px solid {{ c.border }}; background: {{ c.bg }}; color: {{ c.fg }}; font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; cursor: pointer; border-radius: 2px; transition: all 0.2s;\" style-hover=\"transform: translateY(-2px); border-color: var(--ink);\">{{ c.label }}<\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <div style=\"display: flex; flex-wrap: wrap; gap: 10px; transform-origin: 50% 0; animation: gridIn 1ms linear both; animation-timeline: view(); animation-range: entry 0% entry 35%;\">\n    <sc-for list=\"{{ skillTags }}\" as=\"t\" hint-placeholder-count=\"30\">\n      <span style=\"padding: 11px 18px; background: var(--card); border: 1px solid var(--line); font-size: 13.5px; font-weight: 500; opacity: {{ t.opacity }}; transition: opacity 0.3s, border-color 0.2s, transform 0.25s, box-shadow 0.25s; cursor: default;\" style-hover=\"border-color: var(--ink); transform: translateY(-4px); box-shadow: 0 12px 22px rgba(25,23,19,0.09);\">{{ t.name }}<span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--muted); margin-left: 8px;\">{{ t.tag }}<\u002Fspan><\u002Fspan>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ INTERLUDE: THE HUMAN ============ -->\n<section data-screen-label=\"About\" style=\"padding: 110px 40px; max-width: 1200px; margin: 0 auto; border-top: 1px solid var(--line); overflow: hidden;\">\n  <div id=\"aboutGrid\" style=\"display: grid; grid-template-columns: 0.8fr 1.3fr; gap: 80px; align-items: center;\">\n    <div style=\"position: relative; animation: revealL 1ms linear both; animation-timeline: view(); animation-range: entry 0% entry 35%;\">\n      <div style=\"position: absolute; inset: -36px; border: 1px dashed rgba(31,95,69,0.45); border-radius: 50%; animation: spin2d 45s linear infinite; pointer-events: none;\"><\u002Fdiv>\n      <div style=\"position: absolute; inset: -14px; border: 1px dashed rgba(31,95,69,0.2); border-radius: 50%; animation: spin2d 30s linear infinite reverse; pointer-events: none;\"><\u002Fdiv>\n      <div onmousemove=\"{{ tPhotoMove }}\" onmouseleave=\"{{ tPhotoLeave }}\" style=\"position: relative; background: var(--card); border: 1px solid var(--line); padding: 12px 12px 0; transform: {{ tPhoto }}; transition: transform 0.2s ease-out, box-shadow 0.3s; will-change: transform;\" style-hover=\"box-shadow: 0 32px 64px rgba(25,23,19,0.18);\">\n        <img src=\"9b4086a6-7b28-40e1-bea8-68bdd77fd7e0\" alt=\"Sam Oswald, Toronto\" style=\"width: 100%; display: block; filter: grayscale(0.85); transition: filter 0.6s ease;\" style-hover=\"filter: grayscale(0);\">\n        <div style=\"display: flex; justify-content: space-between; padding: 12px 4px; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--muted);\">\n          <span>SAM OSWALD<\u002Fspan>\n          <span>43.6532° N, 79.3832° W<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"animation: revealR 1ms linear both; animation-timeline: view(); animation-range: entry 0% entry 35%;\">\n      <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--accent); margin-bottom: 26px;\">// THE HUMAN BEHIND THE DASHBOARDS<\u002Fdiv>\n      <p style=\"margin: 0; font-size: clamp(24px, 2.6vw, 34px); line-height: 1.35; letter-spacing: -0.015em; font-weight: 600; color: var(--ink);\">“Data is the new oil, but <em style=\"font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; color: var(--accent);\">refinement<\u002Fem> is the engine. I don't just track metrics — I architect intelligence systems that turn raw signals into <em style=\"font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; color: var(--accent);\">executive strategy<\u002Fem>.”<\u002Fp>\n      <p style=\"margin: 30px 0 0; font-size: 15.5px; line-height: 1.7; color: var(--body); max-width: 520px;\">Based in Toronto. Most months you'll find me walking the C-suite through the analytics readout, training teammates to self-serve in GA4, or arguing — politely — that the budget should follow the marginal CPA.<\u002Fp>\n      <div style=\"display: flex; gap: 10px; flex-wrap: wrap; margin-top: 28px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted);\">\n        <span style=\"padding: 7px 13px; border: 1px solid var(--line); background: var(--card);\">TORONTO, ON<\u002Fspan>\n        <span style=\"padding: 7px 13px; border: 1px solid var(--line); background: var(--card);\">C-SUITE READOUTS, MONTHLY<\u002Fspan>\n        <span style=\"padding: 7px 13px; border: 1px solid var(--line); background: var(--card);\">12+ ANALYSTS COACHED<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 06 CONTACT ============ -->\n<footer id=\"contact\" data-screen-label=\"Contact\" style=\"background: #14120E; color: #F2EFE6; margin-top: 40px;\">\n  <div style=\"max-width: 1200px; margin: 0 auto; padding: 100px 40px 50px;\">\n    <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #7FD6AE; margin-bottom: 20px;\">10 — CONTACT<\u002Fdiv>\n    <h2 style=\"margin: 0; font-size: clamp(40px, 6vw, 80px); letter-spacing: -0.035em; font-weight: 700; line-height: 1.02; animation: deepUp 1ms linear both; animation-timeline: view(); animation-range: entry 0% entry 45%;\">Let's make your numbers <em style=\"font-family: 'Instrument Serif', serif; font-weight: 400; font-style: italic; color: #7FD6AE;\">mean something.<\u002Fem><\u002Fh2>\n    <div style=\"display: flex; gap: 16px; flex-wrap: wrap; margin-top: 46px;\">\n      <a href=\"mailto:samoswald2708@gmail.com\" style=\"padding: 16px 34px; background: #7FD6AE; color: #14120E; font-weight: 700; font-size: 16px; border-radius: 2px; display: inline-block; transition: transform 0.25s, background 0.2s, box-shadow 0.25s;\" style-hover=\"background: #A5E5C6; color: var(--ink); transform: translateY(-4px); box-shadow: 0 16px 32px rgba(0,0,0,0.35);\">samoswald2708@gmail.com<\u002Fa>\n      <a href=\"https://www.linkedin.com/in/samoswald2708/\" target=\"_blank\" style=\"padding: 16px 34px; border: 1px solid rgba(255,255,255,0.3); color: #F2EFE6; font-weight: 600; font-size: 16px; border-radius: 2px; display: inline-block; transition: transform 0.25s, border-color 0.2s, color 0.2s;\" style-hover=\"border-color: #7FD6AE; color: #7FD6AE; transform: translateY(-4px);\">LinkedIn ↗<\u002Fa>\n      <a href=\"assets/Sam-Oswald-Resume.pdf\" download=\"Sam-Oswald-Resume.pdf\" style=\"padding: 16px 34px; border: 1px solid rgba(255,255,255,0.3); color: #F2EFE6; font-weight: 600; font-size: 16px; border-radius: 2px; display: inline-block; transition: transform 0.25s, border-color 0.2s, color 0.2s;\" style-hover=\"border-color: #7FD6AE; color: #7FD6AE; transform: translateY(-4px);\">Resume (PDF) ↓<\u002Fa>\n    <\u002Fdiv>\n    <div ref=\"{{ sigRef }}\" style=\"display: flex; align-items: baseline; gap: 22px; margin-top: 76px;\">\n      <div style=\"font-family: 'Mrs Saint Delafield', cursive; font-size: clamp(64px, 7vw, 100px); color: #7FD6AE; line-height: 1; transform: rotate(-3deg); clip-path: {{ sigClip }}; transition: clip-path 2.2s cubic-bezier(0.35, 0, 0.3, 1);\">Sam Oswald<\u002Fdiv>\n      <span style=\"width: 9px; height: 9px; border-radius: 50%; background: #7FD6AE; opacity: {{ sigDotO }}; transform: scale({{ sigDotS }}); transition: opacity 0.35s 2.1s, transform 0.35s 2.1s cubic-bezier(0.34, 1.56, 0.64, 1);\"><\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-top: 40px; padding-top: 24px; border-top: 1px solid rgba(255,255,255,0.12); font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #8B857A;\">\n      <span>TORONTO, ON · 647.469.8613<\u002Fspan>\n      <span>© 2026 SAM OSWALD — DESIGNED &amp; MEASURED BY HAND<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;reduceMotion&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Behavior&quot;}, &quot;defaultAttributionModel&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;first&quot;, &quot;last&quot;, &quot;dda&quot;], &quot;default&quot;: &quot;dda&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Behavior&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    counters: [0, 0, 0, 0, 0],\n    roasHover: 11,\n    funnelHover: null,\n    cohortHover: null,\n    attribModel: (this.props && this.props.defaultAttributionModel) || 'dda',\n    skillFilter: 'All',\n    ab: { running: false, done: false, t: 0 },\n    caseTab: 0,\n    sim: { search: 180, social: 120, li: 60, display: 40 },\n    sqlTab: 0,\n    sqlPhase: 'idle',\n    consentGranted: true,\n    serverSide: true,\n    sigOn: false,\n    motionOff: (typeof localStorage !== 'undefined' && localStorage.getItem('so-motion') === 'off'),\n    dark: (typeof localStorage !== 'undefined' && localStorage.getItem('so-theme') === 'dark')\n  };\n\n  motionDisabled() {\n    return (this.props.reduceMotion ?? false) || this.state.motionOff;\n  }\n\n  applyTheme() {\n    document.body.dataset.theme = this.state.dark ? 'dark' : 'light';\n  }\n\n  heroMove = (e) => {\n    if (this.motionDisabled()) return;\n    const r = e.currentTarget.getBoundingClientRect();\n    const px = ((e.clientX - r.left) / r.width - 0.5) * -18;\n    const py = ((e.clientY - r.top) / r.height - 0.5) * -12;\n    this._heroNext = { px, py };\n    if (this._heroRaf) return;\n    this._heroRaf = requestAnimationFrame(() => {\n      this._heroRaf = null;\n      this.setState({ hero: this._heroNext });\n    });\n  };\n\n  heroLeave = () => {\n    this._heroNext = { px: 0, py: 0 };\n    this.setState({ hero: this._heroNext });\n  };\n\n  sigRef = (el) => {\n    if (!el || this._sigObs) return;\n    if (this.motionDisabled()) { this.setState({ sigOn: true }); return; }\n    this._sigObs = new IntersectionObserver((entries) => {\n      if (entries[0].isIntersecting) {\n        this.setState({ sigOn: true });\n        this._sigObs.disconnect();\n      }\n    }, { threshold: 0.4 });\n    this._sigObs.observe(el);\n  };\n\n  applyMotionPref() {\n    const off = this.motionDisabled() ?? false;\n    let s = document.getElementById('reduce-motion-style');\n    if (off && !s) {\n      s = document.createElement('style');\n      s.id = 'reduce-motion-style';\n      s.textContent = '*, *::before, *::after { animation: none !important; transition: none !important; }';\n      document.head.appendChild(s);\n    }\n    if (!off && s) s.remove();\n  }\n\n  componentDidUpdate() {\n    this.applyMotionPref();\n    this.applyTheme();\n  }\n\n  queueTilt(next) {\n    this._tiltNext = next;\n    if (this._tiltRaf) return;\n    this._tiltRaf = requestAnimationFrame(() => {\n      this._tiltRaf = null;\n      this.setState({ tilt: this._tiltNext });\n    });\n  }\n\n  tiltHandlers(key) {\n    return {\n      move: (e) => {\n        if (this.motionDisabled()) return;\n        const r = e.currentTarget.getBoundingClientRect();\n        const rx = ((e.clientY - r.top) / r.height - 0.5) * -7;\n        const ry = ((e.clientX - r.left) / r.width - 0.5) * 9;\n        this.queueTilt({ key, t: 'perspective(950px) rotateX(' + rx.toFixed(2) + 'deg) rotateY(' + ry.toFixed(2) + 'deg) translateY(-3px)' });\n      },\n      leave: () => this.queueTilt(null)\n    };\n  }\n\n  tiltT(key) {\n    return this.state.tilt && this.state.tilt.key === key ? this.state.tilt.t : 'none';\n  }\n\n  componentDidMount() {\n    this.applyMotionPref();\n    this.applyTheme();\n    this._clock = setInterval(() => this.forceUpdate(), 1000);\n    const reduce = this.motionDisabled() ?? false;\n    const targets = [21, 22, 5, 20, 300];\n    if (reduce) { this.setState({ counters: targets }); return; }\n    const start = performance.now();\n    const tick = (now) => {\n      const t = Math.min(1, (now - start) / 1400);\n      const e = 1 - Math.pow(1 - t, 3);\n      this.setState({ counters: targets.map(v => Math.round(v * e)) });\n      if (t < 1) this._cRaf = requestAnimationFrame(tick);\n    };\n    this._cRaf = requestAnimationFrame(tick);\n  }\n\n  componentWillUnmount() {\n    cancelAnimationFrame(this._cRaf);\n    cancelAnimationFrame(this._abRaf);\n    cancelAnimationFrame(this._tiltRaf);\n    clearTimeout(this._sqlTimer);\n    if (this._sigObs) this._sigObs.disconnect();\n    clearInterval(this._clock);\n    cancelAnimationFrame(this._heroRaf);\n  }\n\n  runAb() {\n    if (this.state.ab.running) return;\n    cancelAnimationFrame(this._abRaf);\n    if (this.state.ab.done) { this.setState({ ab: { running: false, done: false, t: 0 } }); return; }\n    const dur = this.motionDisabled() ? 300 : 3600;\n    const start = performance.now();\n    const tick = (now) => {\n      const t = Math.min(1, (now - start) / dur);\n      this.setState({ ab: { running: t < 1, done: t >= 1, t } });\n      if (t < 1) this._abRaf = requestAnimationFrame(tick);\n    };\n    this._abRaf = requestAnimationFrame(tick);\n    this.setState({ ab: { running: true, done: false, t: 0 } });\n  }\n\n  renderVals() {\n    const accent = 'var(--accent)';\n    const c = this.state.counters;\n    const kpis = [\n      { value: '+' + c[0] + '%', label: 'LEAD CONVERSION LIFT — SITEWIDE CRO PROGRAM' },\n      { value: '\\u2212' + c[1] + '%', label: 'CPA REDUCTION — FULL-FUNNEL PAID MEDIA' },\n      { value: '$' + c[2] + 'M+', label: 'ANNUALIZED AD SPEND OWNED — GOOGLE, META, LINKEDIN' },\n      { value: c[3] + '+', label: 'PROPERTIES ARCHITECTED ON GA4 + BIGQUERY' },\n      { value: c[4] + '+', label: 'USER INTERACTIONS INSTRUMENTED, WEB + APP' }\n    ].map((k, i) => ({ ...k, r1: i * 6, r2: 42 + i * 6 }));\n\n    /* ---- ROAS chart ---- */\n    const roasVals = [2.1, 2.3, 2.2, 2.6, 2.4, 2.8, 3.0, 2.7, 3.1, 3.3, 3.2, 3.4];\n    const spend = [310, 325, 318, 362, 340, 395, 410, 388, 412, 430, 442, 458];\n    const months = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];\n    const px = i => 10 + i * (580 / 11);\n    const py = v => 210 - ((v - 2.0) / 1.6) * 185;\n    const pts = roasVals.map((v, i) => px(i) + ',' + py(v).toFixed(1));\n    const roasPath = 'M' + pts.join(' L');\n    const roasArea = roasPath + ' L' + px(11) + ',230 L' + px(0) + ',230 Z';\n    const hi = this.state.roasHover;\n    const roasZones = roasVals.map((v, i) => ({\n      x: i * 50,\n      onEnter: () => this.setState({ roasHover: i })\n    }));\n    const roasTooltip = months[hi] + ' \\u00b7 ROAS ' + roasVals[hi].toFixed(1) + '\\u00d7 \\u00b7 SPEND $' + spend[hi] + 'K';\n\n    /* ---- Funnel ---- */\n    const funnel = [\n      { label: 'Sessions', count: '482K', pct: 100 },\n      { label: 'Product detail views', count: '308K', pct: 64 },\n      { label: 'Application started', count: '149K', pct: 31 },\n      { label: 'Details completed', count: '87K', pct: 18 },\n      { label: 'Funded account', count: '45K', pct: 9.4 }\n    ];\n    const fh = this.state.funnelHover;\n    const funnelRows = funnel.map((f, i) => {\n      const isHover = fh , '\\u221218% BOUNCE RATE', '12+ TEAMMATES TRAINED'],\n        groups: [\n          ['Web & App Analytics', [\n            'Architected GA4 measurement across 20+ B2B/B2C properties \\u2014 dataLayer specs, GTM container builds, full ecommerce and funnel event schemas \\u2014 with BigQuery export powering attribution models and audience activation.',\n            'Led Adobe Analytics \\u2192 GA4 migration: event taxonomy, pathing analysis, custom channel groupings \\u2014 preserving omnichannel attribution continuity through the UA sunset.',\n            'Implemented consent-aware tracking \\u2014 Consent Mode v2, CMP signals, server-side tagging (sGTM) \\u2014 protecting data quality and PIPEDA/GDPR compliance against ad blockers and browser privacy restrictions.',\n            'Worked with large customer-level datasets to power offer targeting, personalization, and suppression logic.'\n          ]],\n          ['Conversion Rate Optimization', [\n            'Spearheaded a sitewide CRO program that lifted lead conversion 21% in 6 months using heatmaps, scroll-depth analysis, and multivariate testing.',\n            'Partnered with UX to A/B test CTA verbiage, button placement, and layout structures across landing pages.',\n            'Leveraged Quantum Metric session replay to identify friction points and improve the mobile checkout flow.',\n            'Conducted heuristic evaluations across high-exit pages and redesigned navigation pathways, reducing bounce rate 18%.'\n          ]],\n          ['Campaign & Channel Analytics', [\n            'Built multi-channel campaign scorecards unifying CRM, GA4, and ad-platform data to evaluate CPA, CPL, ROAS, and CAC.',\n            'Led Salesforce Marketing Cloud + GA4 integration to measure email nurture impact on return visits and purchases.',\n            'Performed multi-touch attribution modeling with custom rules in BigQuery SQL to determine true ROI of display, search, and affiliate channels.',\n            'Automated weekly campaign dashboards in Looker Studio with real-time UTM drilldowns and channel summaries.'\n          ]],\n          ['Paid Media Execution', [\n            'Owned hands-on execution and optimization of paid search and social across Google Ads, Meta, and LinkedIn \\u2014 $400K+ monthly budgets, $5M+ annualized.',\n            'Launched full-funnel acquisition and retargeting campaigns, reducing CPA 22% while maintaining lead volume.',\n            'Performed daily in-platform optimizations \\u2014 bids, keyword expansion, audience exclusions, budget reallocation \\u2014 to hit ROAS targets.',\n            'Tested ad copy and landing pages with creative and lifecycle teams, increasing CTR 28% and conversion rate 19%.'\n          ]],\n          ['Advanced Analytics & Enablement', [\n            'Built product engagement cohort models in BigQuery to map retention patterns and feature adoption curves.',\n            'Performed audience segmentation and campaign performance analysis using SQL, Python, and CRM data.',\n            'Presented monthly analytics readouts to the C-suite \\u2014 translating digital KPIs into actionable next steps tied to revenue targets.',\n            'Trained 12+ cross-functional team members to self-serve in GA4, fostering a data-informed culture.'\n          ]]\n        ]\n      },\n      {\n        company: 'Walmart Canada', role: 'Digital Analytics Analyst', period: '01/2021 \\u2014 03/2023', location: 'TORONTO, ON',\n        metrics: ['+25% CTR', '+17% CONVERSION', '+40% LEAD ACCURACY', '2\\u00d7 ORGANIC TRAFFIC YOY', '18% BUDGET SAVED'],\n        groups: [\n          ['Web & App Analytics', [\n            'Deployed full event-based tracking across web and mobile apps using GA4 + Firebase, capturing 300+ user interactions.',\n            'Designed customer funnel visualizations in Tableau, connecting BigQuery datasets to daily executive dashboards.',\n            'Managed ecommerce tag implementations in GTM \\u2014 cart, coupon usage, product impressions, abandonment tracking.',\n            'Ran monthly tag audits and data QA, resolving broken tags, double-counted events, and misattributed channels.'\n          ]],\n          ['Conversion Rate Optimization', [\n            'A/B tested homepage vs. category-page CTAs with UI/UX, increasing CTR 25% and conversion 17%.',\n            'Conducted scroll-depth and session analysis in Hotjar to optimize content placement and reduce bounce rate.',\n            'Implemented conversion funnel event tracking for form fills, downloads, and product trials \\u2014 improving lead-tracking accuracy 40%.',\n            'Created automated GA Intelligence alerts for major drops in funnel performance and outages.'\n          ]],\n          ['Campaign & Channel Analytics', [\n            'Audited and optimized paid campaigns across Google, Meta, and LinkedIn \\u2014 sharpened targeting to save 18% of budget with no loss in performance.',\n            'Led end-to-end product-launch reporting: pre-launch baselines, post-launch lift, and channel attribution.',\n            'Built Looker Studio dashboards for real-time ROAS monitoring by campaign, geo, and device type.',\n            'Partnered with SEO to measure organic impact of content refresh projects \\u2014 2\\u00d7 traffic growth YoY.'\n          ]],\n          ['Advanced Analytics & Enablement', [\n            'Built marketing mix models from historical campaign data to reallocate budget toward high-ROI channels.',\n            'Introduced standardized UTM naming conventions across all channels, improving reporting consistency 95%.',\n            'Facilitated monthly \\u201canalytics office hours\\u201d supporting product, content, and marketing teams.'\n          ]]\n        ]\n      }\n    ];\n    return data.map((job, ji) => ({\n      company: job.company, role: job.role, period: job.period, location: job.location, metrics: job.metrics,\n      anim: ji % 2 === 0 ? 'revealL' : 'revealR',\n      groups: job.groups.map(([title, items], gi) => {\n        const key = ji + '-' + gi;\n        const open = !!this._open[key];\n        return {\n          title,\n          items,\n          open,\n          count: items.length + ' ITEMS',\n          arrow: open ? '\\u2212' : '+',\n          toggle: () => toggle(key)\n        };\n      })\n    }));\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
